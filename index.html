<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./aethergenix.svg" />
    <title>AetherGenix</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var theme;
        try { theme = localStorage.getItem('aethergenix_theme'); } catch(e) {}
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
