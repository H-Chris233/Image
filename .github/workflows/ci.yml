name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/frontend-dev

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: UI smoke gate
        timeout-minutes: 5
        run: npm run smoke:ui
